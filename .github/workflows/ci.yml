name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests (hardware-free)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"

      - name: Sync dependencies
        run: uv sync --all-extras

      - name: Pytest (unit + e2e, no hardware)
        # `real` = tests that need a physical CAN bus / motors / cameras.
        run: uv run pytest -m "not real"

  lint:
    # Advisory only: the existing tree has a large pre-existing ruff backlog, so lint is
    # not a merge gate yet. Kept visible so new code trends clean and the backlog can be
    # burned down before flipping this to blocking.
    name: ruff + pyright (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"

      - name: Sync dependencies
        run: uv sync --all-extras

      - name: Ruff
        run: uv run ruff check .

      - name: Pyright
        run: uv run pyright
